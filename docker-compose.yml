services:
  backend:
    image: ghcr.io/tansanmilmil/uwabami-backend:${UWABAMI_IMAGE_TAG:-local}
    build: ./backend
    environment:
      - UWABAMI_GOOGLE_CLIENT_ID=${UWABAMI_GOOGLE_CLIENT_ID}
      - UWABAMI_GOOGLE_CLIENT_SECRET=${UWABAMI_GOOGLE_CLIENT_SECRET}
      - UWABAMI_GOOGLE_REDIRECT_URI=${UWABAMI_GOOGLE_REDIRECT_URI}
      - UWABAMI_GOOGLE_ALLOWED_ACCOUNTS=${UWABAMI_GOOGLE_ALLOWED_ACCOUNTS}
      - UWABAMI_DB_PATH=/app/db/drinks.db
      - UWABAMI_OPENAI_API_KEY=${UWABAMI_OPENAI_API_KEY}
      - UWABAMI_JWT_SECRET_KEY=${UWABAMI_JWT_SECRET_KEY}
    volumes:
      - ./db:/app/db
      - uploads:/app/uploads
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/tansanmilmil/uwabami-frontend:${UWABAMI_IMAGE_TAG:-local}
    build:
      context: ./frontend
    volumes:
      - static:/static
    networks:
      - app-net

  nginx:
    image: ghcr.io/tansanmilmil/uwabami-nginx:${UWABAMI_IMAGE_TAG:-local}
    build:
      context: ./nginx
    environment:
      - UWABAMI_CLOUDFRONT_SECRET=${UWABAMI_CLOUDFRONT_SECRET:-}
    ports:
      - "8093:80"
    volumes:
      - static:/usr/share/nginx/html
      - uploads:/usr/share/nginx/uploads
      - ./logs/nginx:/var/log/nginx
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - app-net
    restart: unless-stopped

volumes:
  static:
  uploads:

networks:
  app-net:
    driver: bridge
