services:
  backend:
    build: ./backend
    environment:
      - UWABAMI_BASIC_AUTH_USER=${UWABAMI_BASIC_AUTH_USER}
      - UWABAMI_BASIC_AUTH_PASS=${UWABAMI_BASIC_AUTH_PASS}
      - UWABAMI_DB_PATH=/app/db/drinks.db
      - UWABAMI_OPENAI_API_KEY=${UWABAMI_OPENAI_API_KEY}
      - UWABAMI_JWT_SECRET_KEY=${UWABAMI_JWT_SECRET_KEY}
    volumes:
      - ./db:/app/db
      - uploads:/app/uploads
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    volumes:
      - static:/static
    networks:
      - app-net

  nginx:
    build:
      context: ./nginx
    environment:
      - UWABAMI_CLOUDFRONT_SECRET=${UWABAMI_CLOUDFRONT_SECRET:-}
    ports:
      - "8093:80"
    volumes:
      - static:/usr/share/nginx/html
      - uploads:/usr/share/nginx/uploads
      - ./logs/nginx:/var/log/nginx
      - ${VENUS_NGINX_BLOCKLIST_DIR:-./nginx/blocklist}:/etc/nginx/blocklist:ro
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks:
      - app-net
    restart: unless-stopped

volumes:
  static:
  uploads:

networks:
  app-net:
    driver: bridge
