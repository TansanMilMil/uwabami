map_hash_bucket_size 128;

map $http_x_cloudfront_secret $cloudfront_blocked {
    default                  1;
    "${UWABAMI_CLOUDFRONT_SECRET}"   0;
}

map $cloudfront_blocked $cloudfront_ok {
    0       1;
    default 0;
}

map $http_cloudfront_viewer_address $cloudfront_viewer_ip {
    default                                    "";
    "~^(?<viewer_ip>[0-9A-Fa-f.:]+):[0-9]+$"   $viewer_ip;
}

# CloudFront-Viewer-Address is spoofable on direct access, so trust it only when the secret matches
map "$cloudfront_blocked:$cloudfront_viewer_ip" $client_ip {
    "~^0:(?<trusted_viewer_ip>.+)$"   $trusted_viewer_ip;
    default                           $remote_addr;
}

geo $client_ip $crowdsec_ip_blocked {
    default 0;
    include /etc/nginx/blocklist/crowdsec_ip.conf;
}

geo $client_ip $ioc_ip_blocked {
    default 0;
    include /etc/nginx/blocklist/ioc_ip.conf;
}

map $http_user_agent $ioc_ua_blocked {
    default 0;
    include /etc/nginx/blocklist/ioc_ua.conf;
}

# IPs banned by CrowdSec go to blocked.log, which CrowdSec does not read, so they do not raise alerts again
map "$cloudfront_ok:$crowdsec_ip_blocked" $log_access {
    "1:0"   1;
    default 0;
}

map "$cloudfront_blocked:$crowdsec_ip_blocked" $log_direct {
    "1:0"   1;
    default 0;
}

# Explicitly omit $http_x_cloudfront_secret to prevent secret from appearing in logs
log_format client_combined '$host $client_ip - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent" rid=$request_id';

limit_req_zone  $client_ip zone=api_req:10m  rate=10r/s;
limit_req_zone  $client_ip zone=ai_req:10m   rate=1r/m;
limit_conn_zone $client_ip zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log client_combined if=$log_access;
    access_log /var/log/nginx/direct.log client_combined if=$log_direct;
    access_log /var/log/nginx/blocked.log client_combined if=$crowdsec_ip_blocked;

    root /usr/share/nginx/html;
    index index.html;

    keepalive_timeout 60s;
    client_max_body_size 20m;
    client_body_timeout 10s;
    send_timeout 10s;

    limit_conn conn_limit 10;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header X-CloudFront-Secret "";

    if ($crowdsec_ip_blocked) {
        return 403;
    }

    if ($ioc_ip_blocked) {
        return 403;
    }

    if ($ioc_ua_blocked) {
        return 403;
    }

    if ($cloudfront_blocked) {
        return 403;
    }

    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ai/ {
        limit_req zone=ai_req burst=2 nodelay;
        proxy_pass http://backend:8000;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_req burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
